# Overrides layered on the upstream docker-compose.yml for this fork.
# - mounts our patched server + admin module over the image
# - persists player towns on the host (upstream doesn't -> saves wiped on recreate)
# - restart policy so containers survive host reboots (upstream sets none)
services:
  server:
    restart: unless-stopped
    volumes:
      - ./tsto_server.py:/app/tsto_server.py:ro
      - ./tsto_admin.py:/app/tsto_admin.py:ro
      - ./towns:/app/towns
